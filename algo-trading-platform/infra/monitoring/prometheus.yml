# ============================================================================
# Prometheus configuration for Algo Trading Platform
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "algo-trading-platform"
    metrics_path: /api/monitoring/metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          environment: "production"
          service: "algo-platform"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
