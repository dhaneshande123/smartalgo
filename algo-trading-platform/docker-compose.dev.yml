# ============================================================================
# Docker Compose — Development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    volumes:
      - ./core:/app/core
      - ./strategies:/app/strategies
      - ./data:/app/data
      - ./analytics:/app/analytics
      - ./backtest:/app/backtest
      - ./config:/app/config
      - ./dashboard:/app/dashboard
    ports:
      - "8080:8080"
      - "5678:5678"    # debugpy remote debugger
    environment:
      LOG_LEVEL: DEBUG
      PYTHONDONTWRITEBYTECODE: "0"
    command: >
      uvicorn core.api:app
      --host 0.0.0.0
      --port 8080
      --reload
      --reload-dir /app/core
      --reload-dir /app/strategies
      --log-level debug

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
